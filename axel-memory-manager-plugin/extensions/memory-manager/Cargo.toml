[package]
name = "memory-manager"
version = "0.2.0"
edition = "2021"
description = "Axel memory manager — Synaps CLI extension (JSON-RPC 2.0 over stdio)"
license = "MIT"

[[bin]]
name = "memory-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# File-system watcher for plugin-side live config reloads. Same major as the
# host (SynapsCLI/Cargo.toml pins notify 6.x), so they share a backend.
notify = "6"

# Upstream Axel — portable agent intelligence (.r8 brain file).
# https://github.com/maha-media/axel
# Pinned to the exact axel commit carrying the T32–T36 project-memory layer
# (branch feat/project-memory-t32-t36). Until that commit is pushed to the
# remote, build with the local worktree patch (see README "Building against
# a local axel checkout").
axel = { git = "https://github.com/maha-media/axel", rev = "562e6508f5de0cdc0bbc803b2448aeb7431a6bed" }
axel-memkoshi = { git = "https://github.com/maha-media/axel", rev = "562e6508f5de0cdc0bbc803b2448aeb7431a6bed" }
velocirag = { git = "https://github.com/maha-media/axel", rev = "562e6508f5de0cdc0bbc803b2448aeb7431a6bed" }
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
tokenizers = "0.21"
ndarray = "0.17"
# Trusted project-scope derivation (canonical key = sha256 of project root).
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
# Integration tests open the .r8 SQLite file directly to verify memory writes.
rusqlite = { version = "0.32", features = ["bundled"] }
# Integration tests create a temp dir for the ephemeral brain file.
tempfile = "3"
